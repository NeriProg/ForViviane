<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Um diário de cartas para abrir com calma.">
  <meta name="theme-color" content="#f7ece5">
  <title>Viviane's place · Diário de cartas</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="./assets/carta.js?v=20261127" defer></script>
  <script src="./assets/site.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="brand"><span aria-hidden="true">♡</span> Viviane's place</span>
    <button class="music" type="button"><span aria-hidden="true">♫</span> <span id="music-label">Tocar música</span></button>
  </header>
  <audio id="soundtrack" src="./assets/lullaby-for-erik.mp3" preload="none" loop></audio>
  <main>
    <section class="intro" aria-labelledby="title">
      <div class="copy">
        <p class="kicker">os versos que te prometi estão aqui</p>
        <h1 id="title">Só para<br><em>você.</em></h1>
        <p class="subtitle">Um pedacinho do que você me faz sentir</p>
        <a class="open" href="#diary">Ver cartas <span aria-hidden="true">↓</span></a>
      </div>
      <div class="still-life" aria-hidden="true">
        <div class="halo"></div>
        <span class="spark first">✧</span><span class="spark second">✦</span><span class="spark third">✧</span>
        <div class="envelope">
          <div class="paper"><span>Para você,</span><i></i><i></i><i></i></div>
          <div class="fold"></div>
          <div class="flap"></div>
          <div class="seal">♥</div>
        </div>
      </div>
    </section>
    <section id="diary" class="diary" aria-labelledby="diary-title">
      <div class="diary-header">
        <h2 id="diary-title">Diário de cartas</h2>
        <button id="new-letter" class="close" type="button" aria-controls="letter-editor" aria-expanded="false">+ Nova carta</button>
      </div>
      <form id="letter-editor" class="letter-editor" hidden>
        <label>Título <input name="titulo" required maxlength="160"></label>
        <label>Data <input name="data" type="date" required></label>
        <label>Corpo da carta <textarea name="corpo" rows="8" required></textarea></label>
        <div class="editor-actions">
          <button class="open" type="submit">Salvar carta</button>
          <button class="close" id="cancel-letter" type="button">Cancelar</button>
        </div>
      </form>
      <p id="editor-status" role="status"></p>
      <ul id="letter-list" class="letter-list" tabindex="0" aria-labelledby="diary-title"></ul>
    </section>
    <article id="letter" class="letter" hidden aria-labelledby="letter-title">
      <time id="letter-date" class="kicker"></time>
      <h2 id="letter-title" tabindex="-1"></h2>
      <div id="letter-body"></div>
      <p id="signature"></p>
      <button class="heart" type="button" aria-label="Deixar um coração" aria-pressed="false">♡</button>
      <p class="heart-status" role="status"></p>
      <button class="close" type="button">Guardar a carta ↑</button>
      <button class="close" id="delete-letter" type="button" hidden>Excluir carta</button>
    </article>
  </main>
  <footer>
    <span aria-hidden="true">✦</span>
    <span id="footer-default">Feito com carinho</span>
    <span id="footer-letter" hidden></span>
  </footer>
</body>
</html>
